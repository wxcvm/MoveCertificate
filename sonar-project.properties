# SonarCloud 配置（MoveCertificate）
#
# 该仓库原先用 SonarCloud 的 Automatic Analysis，但它的分析长期停滞（最新分析停在
# 2026-10-07T06:15，之后所有推送都未被分析）。Automatic Analysis 已关闭，改由
# .github/workflows/sonar.yml 在每次推送时扫描，任何修复都能立刻反映到报告里。
#
# 这个项目只有 shell 与 TypeScript/JavaScript（WebUI），没有构建产物需要纳入分析；
# node_modules 由扫描器自动跳过，但显式排除更省事。

sonar.projectKey=wxcvm_MoveCertificate
sonar.organization=wxcvm
sonar.projectName=MoveCertificate
sonar.sourceEncoding=UTF-8

sonar.sources=.

# 依赖目录与生成物不参与分析（WebUI 的 webroot/ 由 CI 构建产生，不在仓库里）
sonar.exclusions=\
  webdev/node_modules/**,\
  **/node_modules/**,\
  webroot/**,\
  **/*.zip
