name: Build and Package

on:
  push:
    branches: [ main, 'fix/**', 'codex/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webdev/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: webdev
      - name: Typecheck WebUI
        run: npm run typecheck
        working-directory: webdev
      - name: Regression tests
        run: |
          node --test tests/*.test.mjs
          sh tests/runtime-test.sh
          sh tests/namespace-test.sh
          sh tests/service-test.sh
          sh tests/lock-test.sh
          python3 -m unittest discover -s tests -p '*_test.py'
      - name: Shell syntax checks
        run: |
          bash -n buildzip.sh
          for script in *.sh sh/*.sh tests/*.sh; do sh -n "$script"; done
      - name: Build WebUI
        run: npm run build
        working-directory: webdev
      - name: Package module
        run: bash buildzip.sh sweb
      - name: Upload MoveCertificate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MoveCertificate-repair
          path: dist/MoveCertificate-*.zip
          if-no-files-found: error
          retention-days: 30
