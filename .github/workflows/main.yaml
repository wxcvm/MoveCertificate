name: Build and Package

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webdev/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: webdev
      - name: Typecheck WebUI
        run: npm run typecheck
        working-directory: webdev
      - name: Regression tests
        run: |
          node --test tests/*.test.mjs
          sh tests/runtime-test.sh
          sh tests/lock-test.sh
          sh tests/driver-test.sh
          sh tests/wsi3-launcher-test.sh
      - name: Shell syntax checks
        run: |
          bash -n buildzip.sh
          for script in *.sh sh/*.sh driver-fix/*.sh driver-fix/wsi3-module/*.sh tests/*.sh; do sh -n "$script"; done
      - name: Build WebUI
        run: npm run build
        working-directory: webdev
      - name: Verify upstream driver and package modules
        run: |
          python3 scripts/prepare-driver.py
          bash buildzip.sh sweb
      - name: Upload MoveCertificate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MoveCertificate-repair
          path: MoveCertificate-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload guarded PanVK launcher
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PanVK-guarded-launcher
          path: PanVK-guarded-launcher-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload module to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: MoveCertificate-*.zip
      - name: Upload new PanVK RC3 driver
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PanVK-RC3-D8100-Vulkan
          path: PanVK-RC3-D8100-Vulkan.zip
          if-no-files-found: error
          retention-days: 30
